# Pre-commit hooks. After `uv sync`, activate with:
#   uv run pre-commit install
# That installs both the pre-commit hooks and the pre-push test run below.
# Run manually against all files with:
#   uv run pre-commit run --all-files

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # mypy runs as a local hook so it sees the same deps `uv sync` installed,
  # instead of maintaining a parallel dep list in pre-commit's own venv.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        args: [src]

      # Full test suite (with the coverage gate) before every push. This is
      # the only test run; there is no hosted CI.
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
